[package]
name = "openwx-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "openwx: station setup, status checks and an MCP server so AI assistants (Claude and others) can read the weather and help run an OpenWX station"
publish = false

[[bin]]
name = "openwx"
path = "src/main.rs"

[dependencies]
openwx-relay = { path = "../relay" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
axum = { version = "0.8", default-features = false }
serde_json = "1"
anyhow = "1"
dirs = "6"
url = "2"
chrono = { version = "0.4", features = ["clock"] }
env_logger = "0.11"
log = "0.4"
