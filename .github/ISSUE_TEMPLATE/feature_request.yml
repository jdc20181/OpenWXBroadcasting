name: Feature or graphic request
description: An idea for OpenWX: a feature, a data source, a graphic or a map layer
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you show or do on air, and for whom?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: input
    id: source
    attributes:
      label: Data source (if any)
      description: A public source (NWS, NOAA, USGS ...) and a link, if you know one
