# Linux Installer
# Builds the OpenWX .deb and .AppImage on GitHub's standard Ubuntu runner (free for public repositories).
# Runs as part of the Release workflow, or on its own from "Run workflow" (a test build); never on commits.
name: Linux Installer

on:
  workflow_dispatch:
  workflow_call: # used by release.yml

permissions:
  contents: read # builds only; never writes to the repository or its releases

jobs:
  linux-installer:
    name: Linux Installer
    runs-on: ubuntu-24.04 # standard x86-64 runner; larger, paid runners are never used
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install build libraries (window, graphics, sound, MIDI, file dialogs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake nasm \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev libzstd-dev \
            libgtk-3-dev libfuse2t64 file

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build the .deb and .AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # lets the AppImage tools run without FUSE on the runner
        run: cargo packager --release -p openwx-broadcaster --formats deb,appimage

      - name: Name the installers
        run: |
          build=$(tr -d '[:space:]' < app/BUILD_NUMBER)
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          base="OpenWXBroadcasting-Linux-V${version}-${build}"
          mkdir -p out
          cp dist/*.deb "out/${base}.deb"
          cp dist/*.AppImage "out/${base}.AppImage"
          chmod +x "out/${base}.AppImage"
          ls -la out

      - name: Keep the installers (Actions tab, 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: Linux Installer
          path: out/*
          retention-days: 14
