name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  relay-and-cli:
    name: Relay and CLI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p openwx-relay -p openwx-cli
      - run: cargo clippy -p openwx-relay -p openwx-cli -- -D warnings
      - name: Shell script check
        run: bash -n server/install.sh && (command -v shellcheck && shellcheck -S warning server/install.sh || true)

  app:
    name: Desktop app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No large files
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -maxdepth 0 -size +5M 2>/dev/null || true)
          if [ -n "$big" ]; then echo "Files over 5 MB (see docs/repo-hygiene.md):"; echo "$big"; exit 1; fi
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
