[package]
name = "openwx-social-render"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Draws social graphics (alert cards, forecast posts). Library + JSON-in/PNG-out program."
publish = false


[dependencies]
# resvg re-exports tiny-skia and usvg, so the drawing and SVG crates always match.
resvg = "0.49"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[lib]
name = "social_render"
path = "src/lib.rs"

[[bin]]
name = "social-render"
path = "src/main.rs"
